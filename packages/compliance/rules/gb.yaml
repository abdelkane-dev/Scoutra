# Royaume-Uni : UK GDPR + PECR. Indépendants et sociétés de personnes = traités comme particuliers.
jurisdiction: GB
version: '2026-11-22'
sources: ['UK GDPR art. 6', 'PECR reg. 21, 22']
retentionDays: 1095
maxFollowUps: 2
rules:
  - id: gb-individual-direct
    audience: individual
    channels: [email, phone, whatsapp]
    outcome: deny_unless_consent
  - id: gb-corporate-email
    audience: business
    channels: [email]
    outcome: allow_with_conditions
    conditions: { requireOptOut: true, requireIdentification: true, footer: uk_notice }
  - id: gb-corporate-phone
    audience: business
    channels: [phone]
    outcome: allow_with_conditions
    conditions: { requireIdentification: true, checkDoNotCall: true }
  - id: gb-whatsapp
    channels: [whatsapp]
    outcome: deny_unless_consent
  - id: gb-manual-public
    channels: [website_form, social_page]
    outcome: manual_only
